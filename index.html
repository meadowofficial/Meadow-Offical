<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Meadow - Official Corporate Platform</title>
    <meta name="description" content="Official Meadow Corporate Platform & Secure Management Portal" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23059669'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #030712;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #loader-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        z-index: 99999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .brand-title {
        margin-top: 20px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.15em;
        color: #f9fafb;
        text-transform: uppercase;
      }
      .brand-sub {
        margin-top: 6px;
        font-size: 13px;
        color: #9ca3af;
      }
      #app-frame {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="loader-screen">
      <div class="spinner"></div>
      <div class="brand-title">MEADOW</div>
      <div class="brand-sub">Connecting to secure live portal...</div>
    </div>

    <iframe
      id="app-frame"
      src="https://ais-pre-ctgrqv47gnm6ogwqjuwgec-830766157266.asia-southeast1.run.app"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
    ></iframe>

    <script>
      const iframe = document.getElementById('app-frame');
      const loader = document.getElementById('loader-screen');
      
      iframe.onload = function() {
        setTimeout(function() {
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
        }, 300);
      };

      // Fallback in case onload is delayed
      setTimeout(function() {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
      }, 3500);
    </script>
  </body>
</html>
