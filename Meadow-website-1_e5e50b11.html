@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111905; --bg-2:#1A2508; --surface:#1B2709; --fg:#F6EEC2; --muted:#B4BC8C; --line:#33431A;
  --accent:#FFCE07; --accent-fg:#1B2808; --logo:#FFCE07; --nav-fg:#F6EEC2; --nav-bg:#111905; --band:#1D2A0A; --band-fg:#FFD83A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111905; --bg-2:#1A2508; --surface:#1B2709; --fg:#F6EEC2; --muted:#B4BC8C; --line:#33431A;
  --accent:#FFCE07; --accent-fg:#1B2808; --logo:#FFCE07; --nav-fg:#F6EEC2; --nav-bg:#111905; --band:#1D2A0A; --band-fg:#FFD83A; color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; min-height:100svh; transition:background-color .5s;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav-bg)}
body.is-home{background:var(--hero-bg);--nav-fg:#27380A;--nav-bg:var(--hero-bg)}
body.is-inner{--nav-bg:var(--band);--nav-fg:var(--band-fg);--logo:var(--band-fg)}
body.is-stage{--nav-fg:var(--stage-fg);--nav-bg:transparent;--logo:#FFCE07;background:#16200a}
body.is-stage::before{background:transparent}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}

      card.classList.remove('leave'); card.classList.add('enter'); setTimeout(() => { card.classList.remove('enter'); busy = false; }, 1100); }, 430);

function resizePhoto(file, W = 440, H = 440, q = .84) {
  return new Promise((res, rej) => { const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
      const sc = Math.max(W / img.width, H / img.height), sw = W / sc, sh = H / sc; ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, W, H);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => rej(new Error('bad image')); img.src = url; });
}

    const items = d.items.map(i => i.id === el.dataset.id ? { ...i, status: el.value } : i); S.db.doc('applications/' + d.id).set({ items }).then(() => toast('Status updated.')).catch(() => toast('Could not update.')); return; }
  const p = el.dataset.p; if (!p) return; const [root, path] = p.split(':'); setPath(R()[root], path.split('.'), el.value); markDirty(root);
}
MOUNT.admin = () => { if (!S.admin) return; const v = $('#view'); v.addEventListener('click', adminClick); v.addEventListener('input', adminInput); v.addEventListener('change', adminInput); bindFile();
  cleanup = () => { v.removeEventListener('click', adminClick); v.removeEventListener('input', adminInput); v.removeEventListener('change', adminInput); }; };

function onLiveChange(kind) {
  const r = route().name;

  if (r === 'team' || r === 'home') { if (kind === 'content' || kind === 'emps') { if (r === 'team') { render(true); } else if (kind === 'content') render(true); } return; }
  render(true);
}
async function boot() {
  render();

    const user = await claude.use('user');
    if (user) { try { S.admin = await user.canEdit(); } catch (e) {} try { S.uid = await user.id(); } catch (e) {} }
  } catch (e) {}
  let db = null; try { db = await claude.use('db'); } catch (e) {}
  S.db = db; if (S.admin) { S.D = null; }
  render(true);
  if (!db) return;
  db.doc('site/content').onSnapshot(s => { if (s.exists) { S.content = merge(DEFAULTS, s.data()); onLiveChange('content'); } }, () => {});
  db.collection('media').onSnapshot(s => { S.media = {}; s.docs.forEach(d => { S.media[d.id] = d.data().data; }); onLiveChange('media'); }, () => {});
  db.collection('employees').onSnapshot(s => { S.emps = s.docs.map(d => ({ ...d.data(), id: d.id })); if (S.E && !S.eDirty) { const f = S.emps.find(x => x.id === S.E.id); S.E = f ? clone(f) : null; } onLiveChange('emps'); }, () => {});
  if (S.admin) db.collection('applications').onSnapshot(s => { S.apps = s.docs.map(d => ({ id: d.id, ...d.data() })); onLiveChange('apps'); }, () => {});
}
